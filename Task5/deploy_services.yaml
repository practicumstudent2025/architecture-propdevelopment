apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-end-app
  namespace: task5
  labels:
    role: front-end
spec:
  replicas: 1
  selector:
    matchLabels:
      role: front-end
  template:
    metadata:
      labels:
        role: front-end
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: front-end-app
  namespace: task5
spec:
  selector:
    role: front-end
  ports:
  - port: 80
    targetPort: 80
---
